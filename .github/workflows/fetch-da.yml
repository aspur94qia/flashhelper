name: Fetch DA file

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install gdown
        run: pip install gdown

      - name: Download firmware zip dari Google Drive
        run: gdown "https://drive.google.com/uc?id=13cef3Xup_q6V8yLjojGfVMnbR4W433BY" -O firmware.zip

      - name: Daftar isi zip (debug)
        run: unzip -l firmware.zip | tee filelist.txt

      - name: Ambil file DA & Auth saja
        run: |
          mkdir -p extracted
          grep -iE "\.auth$|_da\.bin$|allinone.*\.bin$" filelist.txt | awk '{print $4}' > matches.txt
          cat matches.txt
          if [ ! -s matches.txt ]; then
            echo "Tidak ada file DA/Auth yang cocok, cek filelist.txt manual" 
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            unzip -p firmware.zip "$f" > "extracted/$(basename "$f")"
          done < matches.txt

      - name: Hapus zip besar
        run: rm -f firmware.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vivo-da-files
          path: |
            extracted/
            filelist.txt
